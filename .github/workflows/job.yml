# Runs a pipeline job when a file under jobs/ is pushed. Results and a status.json go to
# the R2 bucket under runs/<job name>/ so they can be checked from anywhere.
name: job
on:
  push:
    branches: [main]
    paths: ['jobs/*.json']
concurrency: { group: job, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install shapely pyproj numpy pillow boto3 requests
      - run: npm ci && npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run -s build:render
      - name: Run changed job files
        run: |
          for f in $(git diff --name-only HEAD~1 HEAD -- 'jobs/*.json'); do
            [ -f "$f" ] && python3 pipeline/job.py "$f"
          done
