# Runs pipeline jobs when files under jobs/ are pushed: one runner per changed job file.
# Results and a status.json go to the R2 bucket under runs/<job name>/.
name: job
on:
  push:
    branches: [main]
    paths: ['jobs/*.json']
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.f.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: f
        run: |
          files=$(git diff --name-only --diff-filter=AMR HEAD~1 HEAD -- 'jobs/*.json' | jq -R . | jq -sc .)
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "$files"
  run:
    needs: plan
    if: needs.plan.outputs.files != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        file: ${{ fromJson(needs.plan.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install shapely pyproj numpy pillow boto3 requests
      - run: npm ci && npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run -s build:render
      - name: Run job
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: exec python3 pipeline/job.py "${{ matrix.file }}"
      - name: Delete any GPU machine this job left behind
        if: always()
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: |
          name=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['name'])" "${{ matrix.file }}")
          python3 -c "import sys;sys.path.insert(0,'pipeline');import vast;print('deleted', vast.destroy_labelled(prefix='iso-'+sys.argv[1]+'-dl'))" "$name"
