name: reaper
on:
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch:
jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python3 pipeline/reaper.py
